<!doctype html>
<html lang="en" class="scroll-smooth antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/sacred_mandala.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SANSKRITI — Walk Through the Stories of India</title>
    <meta name="description" content="Explore India's eternal cultural heritage, sacred temples, folk arts, literature, and scriptures in an extraordinary digital museum experience." />
    
    <!-- Preload Global Flute Audio for instant startup on initial screen load -->
    <link rel="preload" href="/audio/flute.mp3" as="fetch" crossorigin="anonymous" />
    
    <!-- Google Fonts for Classical Indian Heritage & Manuscript Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Marcellus&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Rozha+One&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#120c08] text-[#e8d8b8] overflow-x-hidden selection:bg-[#7a2832] selection:text-[#f7e6c4]">
    <!-- Global Preloaded Ambient Audio: Flute (Musical Identity) + Birds (Nature Ambience) -->
    <audio id="sanskriti-flute-audio" src="/audio/flute.mp3" preload="auto" loop style="display:none;"></audio>
    <audio id="sanskriti-birds-audio" src="/audio/birds.mp3" preload="auto" loop style="display:none;"></audio>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('audio-enabled');
          if (pref !== 'false') {
            var flute = document.getElementById('sanskriti-flute-audio');
            if (flute) {
              flute.volume = 0.18;
              var p1 = flute.play();
              if (p1 !== undefined) p1.catch(function() {});
            }
            var birds = document.getElementById('sanskriti-birds-audio');
            if (birds) {
              birds.volume = 0.05;
              var p2 = birds.play();
              if (p2 !== undefined) p2.catch(function() {});
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
